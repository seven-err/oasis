name: Ponytail Review & Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore:
      - main
      - staging
      - gh-pages

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  office-updater-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test office updater without starting services
        shell: powershell
        run: .\backend\tests\OfficeServerUpdateTest.ps1

  review-and-merge:
    needs: office-updater-tests
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve or create Pull Request for pushed branch
        id: pr
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          BASE_REF_EVENT: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "pr_number=$PR_NUMBER_EVENT" >> "$GITHUB_OUTPUT"
            echo "base_ref=$BASE_REF_EVENT" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARGET_BASE="main"
          if git show-ref --verify --quiet refs/remotes/origin/staging; then
            TARGET_BASE="staging"
          fi

          AHEAD=$(git rev-list --count "origin/$TARGET_BASE..HEAD" || echo "0")
          if [ "$AHEAD" -eq 0 ]; then
            echo "Branch $BRANCH has no commits ahead of origin/$TARGET_BASE; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Open PR #$EXISTING_PR already exists for $BRANCH; pull_request workflow will handle it."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_URL=$(gh pr create --base "$TARGET_BASE" --head "$BRANCH" --fill)
          NEW_PR=$(gh pr view "$PR_URL" --json number --jq '.number')
          echo "Created PR #$NEW_PR for branch $BRANCH -> $TARGET_BASE"
          echo "pr_number=$NEW_PR" >> "$GITHUB_OUTPUT"
          echo "base_ref=$TARGET_BASE" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.pr.outputs.should_run == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.should_run == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.pr.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Ponytail review and checks
        id: review
        if: steps.pr.outputs.should_run == 'true'
        continue-on-error: true
        env:
          BASE_REF: origin/${{ steps.pr.outputs.base_ref }}
          HEAD_REF: HEAD
          RUN_CHECKS: "1"
        run: |
          set +e
          node scripts/ponytail-review.mjs > ponytail-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build production bundle
        id: build
        if: steps.pr.outputs.should_run == 'true' && steps.review.outputs.exit_code == '0'
        run: pnpm build

      - uses: shivammathur/setup-php@v2
        if: steps.pr.outputs.should_run == 'true'
        with:
          php-version: "8.3"

      - name: Backend tests
        id: backend
        if: steps.pr.outputs.should_run == 'true'
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: Post Ponytail review comment
        if: always() && steps.pr.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          if [ -f ponytail-report.md ] && [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file ponytail-report.md
          fi

      - name: Fail if Ponytail review found Must Fix issues
        if: steps.pr.outputs.should_run == 'true' && steps.review.outputs.exit_code != '0'
        run: |
          cat ponytail-report.md
          exit 1

      - name: Auto-merge Pull Request
        # Production promotions/rollbacks into main require a manual merge click.
        if: steps.pr.outputs.should_run == 'true' && steps.pr.outputs.base_ref != 'main' && steps.review.outputs.exit_code == '0' && steps.build.outcome == 'success' && steps.backend.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" --merge --delete-branch || gh pr merge "$PR_NUMBER" --auto --merge --delete-branch
